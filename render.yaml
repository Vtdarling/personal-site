services:
  - type: web
    name: personal-site
    env: node
    plan: free
    buildCommand: rm -rf node_modules package-lock.json && npm cache clean --force && npm install --production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
